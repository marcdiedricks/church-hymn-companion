<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>CHURCH HYMN COMPANION — Projector Output</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overscroll-behavior: none;
    }

    body {
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #projection-shell {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(1rem, 3vw, 3rem) clamp(1.25rem, 5vw, 5rem);
      background: #000;
    }

    #projection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: clamp(0.6rem, 1.8vh, 1.25rem);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #hymn-number {
      color: #f59e0b;
      font-size: clamp(1.2rem, 3vw, 2.35rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    #section-label {
      color: #cbd5e1;
      font-size: clamp(1rem, 2.4vw, 1.9rem);
      font-weight: 750;
      text-align: right;
      white-space: nowrap;
    }

    #main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: clamp(0.35rem, 1.6vh, 1.25rem) 0;
    }

    .lines-container {
      width: 100%;
      max-width: 1700px;
      display: flex;
      flex-direction: column;
      gap: clamp(0.3rem, 1.15vh, 0.85rem);
      text-align: center;
      margin: auto;
    }

    .lyric-line {
      color: #fff;
      font-size: clamp(2rem, 5vw, 5.2rem);
      line-height: 1.18;
      font-weight: 500;
      text-wrap: balance;
    }

    .waiting-state {
      color: #64748b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.25rem, 3vw, 2rem);
      text-align: center;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: max(0.7rem, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      width: min(calc(100% - 1rem), 820px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.6rem;
      padding: 0.65rem;
      border: 1px solid #334155;
      border-radius: 1.1rem;
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 20;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #controls.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #controls button {
      min-height: 3.4rem;
      border: 0;
      border-radius: 0.8rem;
      background: #1e293b;
      color: #fff;
      font: inherit;
      font-size: clamp(0.8rem, 2.3vw, 1rem);
      font-weight: 800;
      padding: 0.6rem 0.35rem;
      cursor: pointer;
    }

    #blank-button {
      background: #111827 !important;
      border: 1px solid #475569 !important;
    }

    #exit-button { background: #7f1d1d !important; }

    #presentation-gate {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 1.25rem;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #presentation-gate.visible { display: grid; }

    .gate-card {
      width: min(92vw, 640px);
      display: grid;
      gap: 1rem;
      justify-items: center;
    }

    .gate-card h1 {
      color: #fff;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
    }

    .gate-card p {
      color: #cbd5e1;
      font-size: clamp(1rem, 3vw, 1.35rem);
      line-height: 1.4;
    }

    #start-presentation-button {
      width: min(100%, 420px);
      min-height: 4rem;
      border: 0;
      border-radius: 0.9rem;
      background: #f59e0b;
      color: #020617;
      font-size: clamp(1rem, 3.2vw, 1.3rem);
      font-weight: 900;
      padding: 0.9rem 1.2rem;
    }

    #rotate-hint {
      display: none;
      color: #fbbf24;
      font-weight: 800;
    }

    body.is-blank #projection-header,
    body.is-blank #main-content { visibility: hidden; }

    body.is-blank,
    body.is-blank #projection-shell { background: #000; }

    @media (max-width: 650px) and (orientation: portrait) {
      #projection-shell { padding: 1rem; }
      #controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lyric-line { font-size: clamp(1.8rem, 8vw, 3.4rem); }
      #rotate-hint { display: block; }
    }

    @media (orientation: landscape) {
      #projection-shell {
        padding: clamp(0.55rem, 1.8vh, 1.25rem) clamp(1.25rem, 4vw, 4rem);
      }

      #projection-header { padding-bottom: clamp(0.25rem, 1vh, 0.7rem); }

      #hymn-number { font-size: clamp(1.1rem, 2.6vw, 2.2rem); }
      #section-label { font-size: clamp(1rem, 2vw, 1.7rem); }

      .lines-container {
        width: 100%;
        max-width: none;
        gap: clamp(0.18rem, 0.8vh, 0.55rem);
      }

      .lyric-line {
        font-size: clamp(1.6rem, 4.7vw, 4.8rem);
        line-height: 1.1;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      #projection-shell { padding: 0.45rem 1.2rem; }
      #hymn-number { font-size: clamp(1rem, 2.4vw, 1.7rem); }
      #section-label { font-size: clamp(0.9rem, 1.8vw, 1.35rem); }
      .lyric-line { font-size: clamp(1.45rem, 4.3vw, 3.1rem); }
      #controls button { min-height: 2.9rem; }
    }
  </style>
</head>
<body>
  <div id="projection-shell">
    <header id="projection-header">
      <div id="hymn-number">CHURCH HYMN COMPANION</div>
      <div id="section-label">PROJECTOR READY</div>
    </header>

    <main id="main-content">
      <div class="waiting-state">Waiting for hymn selection...</div>
    </main>
  </div>

  <div id="controls" aria-hidden="true">
    <button id="previous-button" type="button">◀ Previous</button>
    <button id="blank-button" type="button">⬛ Blank</button>
    <button id="next-button" type="button">Next ▶</button>
    <button id="exit-button" type="button">Exit</button>
  </div>

  <div id="presentation-gate" aria-hidden="true">
    <div class="gate-card">
      <h1>Projector Mode</h1>
      <p>Start full-screen wide projection.</p>
      <p id="rotate-hint">Turn the phone sideways if it does not rotate automatically.</p>
      <button id="start-presentation-button" type="button">START FULL SCREEN</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'church_projection_state';
    const params = new URLSearchParams(window.location.search);
    const isMobileMode = params.get('mode') === 'mobile';

    const hymnNumber = document.getElementById('hymn-number');
    const sectionLabel = document.getElementById('section-label');
    const mainContent = document.getElementById('main-content');
    const controls = document.getElementById('controls');
    const previousButton = document.getElementById('previous-button');
    const blankButton = document.getElementById('blank-button');
    const nextButton = document.getElementById('next-button');
    const exitButton = document.getElementById('exit-button');
    const presentationGate = document.getElementById('presentation-gate');
    const startPresentationButton = document.getElementById('start-presentation-button');

    let projectorState = null;
    let controlsTimer = null;
    let isBlank = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let wakeLock = null;

    function loadStoredState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        projectorState = raw ? JSON.parse(raw) : null;
      } catch {
        projectorState = null;
      }
      return projectorState;
    }

    function saveStoredState() {
      if (!projectorState) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projectorState));
      } catch {}
    }

    function setWaitingState() {
      hymnNumber.textContent = 'CHURCH HYMN COMPANION';
      sectionLabel.textContent = 'PROJECTOR READY';
      mainContent.innerHTML = '<div class="waiting-state">Waiting for hymn selection...</div>';
    }

    function setLines(lines) {
      mainContent.textContent = '';
      const container = document.createElement('div');
      container.className = 'lines-container';

      (lines || []).forEach((line) => {
        const paragraph = document.createElement('p');
        paragraph.className = 'lyric-line';
        paragraph.textContent = line;
        container.appendChild(paragraph);
      });

      mainContent.appendChild(container);
    }

    function renderMobileState() {
      if (!projectorState || !Array.isArray(projectorState.sections) || projectorState.sections.length === 0) {
        setWaitingState();
        return;
      }

      const maxIndex = projectorState.sections.length - 1;
      const safeIndex = Math.min(Math.max(Number(projectorState.activeSectionIndex) || 0, 0), maxIndex);
      projectorState.activeSectionIndex = safeIndex;

      const section = projectorState.sections[safeIndex];
      hymnNumber.textContent = `HYMN #${projectorState.number}`;
      sectionLabel.textContent = (section.label || `VERSE ${safeIndex + 1}`).toUpperCase();
      setLines(section.lines || []);
      saveStoredState();
    }

    function renderBroadcastSlide(data) {
      if (!data) return;
      hymnNumber.textContent = `HYMN #${data.number}`;
      sectionLabel.textContent = (data.label || 'SECTION').toUpperCase();
      setLines(data.lines || []);
    }

    function moveSection(delta) {
      if (!projectorState || !Array.isArray(projectorState.sections)) return;
      const currentIndex = Number(projectorState.activeSectionIndex) || 0;
      const nextIndex = Math.min(Math.max(currentIndex + delta, 0), projectorState.sections.length - 1);
      if (nextIndex === currentIndex) return;

      projectorState.activeSectionIndex = nextIndex;
      isBlank = false;
      document.body.classList.remove('is-blank');
      blankButton.textContent = '⬛ Blank';
      renderMobileState();
    }

    function toggleBlank() {
      isBlank = !isBlank;
      document.body.classList.toggle('is-blank', isBlank);
      blankButton.textContent = isBlank ? 'Show Hymn' : '⬛ Blank';
      showControls();
    }

    function showControls() {
      if (!isMobileMode || presentationGate.classList.contains('visible')) return;

      controls.classList.add('visible');
      controls.setAttribute('aria-hidden', 'false');

      if (controlsTimer) window.clearTimeout(controlsTimer);
      controlsTimer = window.setTimeout(() => {
        controls.classList.remove('visible');
        controls.setAttribute('aria-hidden', 'true');
      }, 3000);
    }

    async function requestWakeLock() {
      if (!isMobileMode || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch {
        wakeLock = null;
      }
    }

    async function enterWidePresentation() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        }
      } catch {}

      try {
        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          await screen.orientation.lock('landscape');
        }
      } catch {}

      presentationGate.classList.remove('visible');
      presentationGate.setAttribute('aria-hidden', 'true');
      requestWakeLock();
    }

    async function tryLandscapeLockWithoutGesture() {
      try {
        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          await screen.orientation.lock('landscape');
        }
      } catch {}
    }

    async function exitProjector() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }

      try {
        if (screen.orientation && typeof screen.orientation.unlock === 'function') {
          screen.orientation.unlock();
        }
      } catch {}

      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch {}

      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.assign('/');
      }
    }

    if (isMobileMode) {
      loadStoredState();
      renderMobileState();
      tryLandscapeLockWithoutGesture();

      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const alreadyLandscape = window.matchMedia('(orientation: landscape)').matches;

      if (standalone && alreadyLandscape) {
        requestWakeLock();
      } else {
        presentationGate.classList.add('visible');
        presentationGate.setAttribute('aria-hidden', 'false');
      }

      startPresentationButton.addEventListener('click', (event) => {
        event.stopPropagation();
        enterWidePresentation();
      });

      previousButton.addEventListener('click', (event) => {
        event.stopPropagation();
        moveSection(-1);
        showControls();
      });

      nextButton.addEventListener('click', (event) => {
        event.stopPropagation();
        moveSection(1);
        showControls();
      });

      blankButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleBlank();
      });

      exitButton.addEventListener('click', (event) => {
        event.stopPropagation();
        exitProjector();
      });

      document.addEventListener('click', (event) => {
        if (!controls.contains(event.target) && !presentationGate.contains(event.target)) showControls();
      });

      document.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      document.addEventListener('touchend', (event) => {
        if (controls.contains(event.target) || presentationGate.contains(event.target)) return;

        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        if (Math.abs(deltaX) >= 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
          if (deltaX < 0) moveSection(1);
          if (deltaX > 0) moveSection(-1);
        }
      }, { passive: true });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === ' ') {
          event.preventDefault();
          moveSection(1);
        } else if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveSection(-1);
        } else if (event.key === 'Escape') {
          exitProjector();
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
      });

      window.addEventListener('beforeunload', () => {
        if (wakeLock) wakeLock.release().catch(() => {});
      });
    } else {
      controls.style.display = 'none';
      presentationGate.style.display = 'none';

      loadStoredState();
      if (projectorState) renderMobileState();

      if ('BroadcastChannel' in window) {
        const channel = new BroadcastChannel('church_projection');
        channel.onmessage = (event) => renderBroadcastSlide(event.data);
      }
    }
  </script>
</body>
</html>
