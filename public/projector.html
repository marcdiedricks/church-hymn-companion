<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>CHURCH HYMN COMPANION — Projector Output</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overscroll-behavior: none;
    }

    body {
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    #projection-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(1rem, 3vw, 3rem) clamp(1.25rem, 5vw, 5rem);
      background: #000;
    }

    #projection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: clamp(0.75rem, 2vh, 1.25rem);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #hymn-number {
      color: #f59e0b;
      font-size: clamp(1.25rem, 3vw, 2.35rem);
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    #section-label {
      color: #cbd5e1;
      font-size: clamp(1rem, 2.4vw, 1.9rem);
      font-weight: 750;
      text-align: right;
    }

    #main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: clamp(0.5rem, 2vh, 1.5rem) 0;
      scrollbar-width: none;
    }

    #main-content::-webkit-scrollbar {
      display: none;
    }

    .lines-container {
      width: min(96%, 1500px);
      display: flex;
      flex-direction: column;
      gap: clamp(0.35rem, 1.3vh, 1rem);
      text-align: center;
      margin: auto;
    }

    .lyric-line {
      color: #fff;
      font-size: clamp(2rem, 5.1vw, 4.9rem);
      line-height: 1.2;
      font-weight: 500;
      text-wrap: balance;
    }

    .waiting-state {
      color: #64748b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.25rem, 3vw, 2rem);
      text-align: center;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      width: min(calc(100% - 1rem), 820px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.6rem;
      padding: 0.65rem;
      border: 1px solid #334155;
      border-radius: 1.1rem;
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 10;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #controls.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #controls button {
      min-height: 3.6rem;
      border: 0;
      border-radius: 0.8rem;
      background: #1e293b;
      color: #fff;
      font: inherit;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      font-weight: 800;
      padding: 0.65rem 0.4rem;
      cursor: pointer;
    }

    #controls button:active {
      transform: scale(0.98);
    }

    #blank-button {
      background: #111827 !important;
      border: 1px solid #475569 !important;
    }

    #exit-button {
      background: #7f1d1d !important;
    }

    body.is-blank #projection-header,
    body.is-blank #main-content {
      visibility: hidden;
    }

    body.is-blank,
    body.is-blank #projection-shell {
      background: #000;
    }

    @media (max-width: 650px) {
      #projection-shell {
        padding: 1rem 1rem 1.25rem;
      }

      #controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .lyric-line {
        font-size: clamp(2rem, 8.4vw, 3.7rem);
      }
    }

    @media (orientation: landscape) and (max-height: 650px) {
      #projection-shell {
        padding: 0.7rem 2rem;
      }

      #projection-header {
        padding-bottom: 0.35rem;
      }

      .lines-container {
        gap: 0.3rem;
      }

      .lyric-line {
        font-size: clamp(1.7rem, 4.5vw, 3.4rem);
        line-height: 1.12;
      }

      #controls button {
        min-height: 3rem;
      }
    }
  </style>
</head>
<body>
  <div id="projection-shell">
    <header id="projection-header">
      <div id="hymn-number">CHURCH HYMN COMPANION</div>
      <div id="section-label">PROJECTOR READY</div>
    </header>

    <main id="main-content">
      <div class="waiting-state">Waiting for hymn selection...</div>
    </main>
  </div>

  <div id="controls" aria-hidden="true">
    <button id="previous-button" type="button">◀ Previous</button>
    <button id="blank-button" type="button">⬛ Blank</button>
    <button id="next-button" type="button">Next ▶</button>
    <button id="exit-button" type="button">Exit</button>
  </div>

  <script>
    const STORAGE_KEY = 'church_projection_state';
    const params = new URLSearchParams(window.location.search);
    const isMobileMode = params.get('mode') === 'mobile';

    const hymnNumber = document.getElementById('hymn-number');
    const sectionLabel = document.getElementById('section-label');
    const mainContent = document.getElementById('main-content');
    const controls = document.getElementById('controls');
    const previousButton = document.getElementById('previous-button');
    const blankButton = document.getElementById('blank-button');
    const nextButton = document.getElementById('next-button');
    const exitButton = document.getElementById('exit-button');

    let projectorState = null;
    let controlsTimer = null;
    let isBlank = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let wakeLock = null;

    function loadStoredState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        projectorState = raw ? JSON.parse(raw) : null;
      } catch {
        projectorState = null;
      }
      return projectorState;
    }

    function saveStoredState() {
      if (!projectorState) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projectorState));
      } catch {
        // Keep projection operational even if storage is unavailable.
      }
    }

    function setWaitingState() {
      hymnNumber.textContent = 'CHURCH HYMN COMPANION';
      sectionLabel.textContent = 'PROJECTOR READY';
      mainContent.innerHTML = '<div class="waiting-state">Waiting for hymn selection...</div>';
    }

    function setLines(lines) {
      mainContent.textContent = '';
      const container = document.createElement('div');
      container.className = 'lines-container';

      (lines || []).forEach((line) => {
        const paragraph = document.createElement('p');
        paragraph.className = 'lyric-line';
        paragraph.textContent = line;
        container.appendChild(paragraph);
      });

      mainContent.appendChild(container);
      mainContent.scrollTop = 0;
    }

    function renderMobileState() {
      if (!projectorState || !Array.isArray(projectorState.sections) || projectorState.sections.length === 0) {
        setWaitingState();
        return;
      }

      const maxIndex = projectorState.sections.length - 1;
      const safeIndex = Math.min(Math.max(Number(projectorState.activeSectionIndex) || 0, 0), maxIndex);
      projectorState.activeSectionIndex = safeIndex;

      const section = projectorState.sections[safeIndex];
      hymnNumber.textContent = `HYMN #${projectorState.number}`;
      sectionLabel.textContent = (section.label || `VERSE ${safeIndex + 1}`).toUpperCase();
      setLines(section.lines || []);
      saveStoredState();
    }

    function renderBroadcastSlide(data) {
      if (!data) return;
      hymnNumber.textContent = `HYMN #${data.number}`;
      sectionLabel.textContent = (data.label || 'SECTION').toUpperCase();
      setLines(data.lines || []);
    }

    function moveSection(delta) {
      if (!projectorState || !Array.isArray(projectorState.sections)) return;
      const currentIndex = Number(projectorState.activeSectionIndex) || 0;
      const nextIndex = Math.min(
        Math.max(currentIndex + delta, 0),
        projectorState.sections.length - 1
      );

      if (nextIndex === currentIndex) return;
      projectorState.activeSectionIndex = nextIndex;
      isBlank = false;
      document.body.classList.remove('is-blank');
      blankButton.textContent = '⬛ Blank';
      renderMobileState();
    }

    function toggleBlank() {
      isBlank = !isBlank;
      document.body.classList.toggle('is-blank', isBlank);
      blankButton.textContent = isBlank ? 'Show Hymn' : '⬛ Blank';
      showControls();
    }

    function showControls() {
      if (!isMobileMode) return;
      controls.classList.add('visible');
      controls.setAttribute('aria-hidden', 'false');

      if (controlsTimer) window.clearTimeout(controlsTimer);
      controlsTimer = window.setTimeout(() => {
        controls.classList.remove('visible');
        controls.setAttribute('aria-hidden', 'true');
      }, 3000);
    }

    function exitProjector() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }

      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.assign('/');
      }
    }

    async function requestWakeLock() {
      if (!isMobileMode || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch {
        wakeLock = null;
      }
    }

    if (isMobileMode) {
      loadStoredState();
      renderMobileState();
      requestWakeLock();

      previousButton.addEventListener('click', (event) => {
        event.stopPropagation();
        moveSection(-1);
        showControls();
      });

      nextButton.addEventListener('click', (event) => {
        event.stopPropagation();
        moveSection(1);
        showControls();
      });

      blankButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleBlank();
      });

      exitButton.addEventListener('click', (event) => {
        event.stopPropagation();
        exitProjector();
      });

      document.addEventListener('click', (event) => {
        if (!controls.contains(event.target)) showControls();
      });

      document.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      document.addEventListener('touchend', (event) => {
        if (controls.contains(event.target)) return;

        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        if (Math.abs(deltaX) >= 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
          if (deltaX < 0) moveSection(1);
          if (deltaX > 0) moveSection(-1);
        }
      }, { passive: true });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === ' ') {
          event.preventDefault();
          moveSection(1);
        } else if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveSection(-1);
        } else if (event.key === 'Escape') {
          exitProjector();
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
      });

      window.addEventListener('beforeunload', () => {
        if (wakeLock) wakeLock.release().catch(() => {});
      });
    } else {
      controls.style.display = 'none';

      // Show the most recently selected hymn immediately, then continue to
      // receive live updates from the operator window on desktop systems.
      loadStoredState();
      if (projectorState) renderMobileState();

      if ('BroadcastChannel' in window) {
        const channel = new BroadcastChannel('church_projection');
        channel.onmessage = (event) => renderBroadcastSlide(event.data);
      }
    }
  </script>
</body>
</html>
