name: Manual Netlify ZIP Build

on:
  push:
    branches:
      - hymnal-premium-icon-preview
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Netlify-ready dist
        uses: actions/upload-artifact@v4
        with:
          name: church-hymn-companion-netlify-dist
          path: dist/
          if-no-files-found: error
