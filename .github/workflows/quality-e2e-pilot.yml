name: Quality E2E Pilot (isolated)
on:
  push:
    branches: [quality-e2e-pilot-20261025]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing app dependencies
        run: npm install --no-package-lock
      - name: Install Playwright test runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-e2e-pilot-report
          path: test-results/
          if-no-files-found: ignore
